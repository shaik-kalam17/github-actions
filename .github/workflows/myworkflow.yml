name: my-first-workflow
# To get trigger on every push in the repo in any branch
on:
  # schedule:
  #   - cron: '*/5 * * * *'
  # # workflow_dispatch:
   push:
jobs:
  job1:
     name: JOB1
     runs-on: ubuntu-latest
     steps:
        - name: step-1
          run: |
             pwd
             ls -ltr
             hostname
        - name: step-2 - Checkout
          uses: actions/checkout@v6.1.0
        - name: step-3
          run: |
             echo `pwd` >> myartifact.txt
             mkdir -p artifacts
             echo `ls -ltr` >> artifacts/list.txt
             echo `hostname` >> artifacts/hostname.txt
        - name: Uplode Single file
          uses: actions/upload-artifact@v7
          with:
            name: single_file
            path: ./myartifact.txt
        - name: uplode from directory 
          uses: actions/upload-artifact@v7
          with:
            name: directory_artifacts
            path: artifacts/
        - name: Uplode from multiple paths
          uses: actions/upload-artifact@v7
          with:
            name: multiple_paths
            path: | 
               ./myartifact.txt
               artifacts/    
        - name: Uplode from multiple paths with exclusion
          uses: actions/upload-artifact@v7
          with:
            name: multiple_paths_with_exclusion
            path: | 
               ./myartifact.txt
               artifacts/
               !**/hostname.txt
          
  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: checking current directory
        run: |
          pwd
          ls -ltr
      - name: Download single file artifact
        uses: actions/download-artifact@v4
        with: 
          name: single_file
      - name: checking current directory post download
        run: |
           pwd
           ls -ltr
      # - name: Calling Sleep
      #   run: sleep 10

  job3:
    name: JOB3
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: checking current directory
        run: |
          pwd
          ls -ltr
      - name: Download directory
        uses: actions/download-artifact@v8
        with: 
          name: directory_artifacts
      - name: checking current directory post download
        run: |
           pwd
           ls -ltr
  job4:
    name: JOB4
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Creating custom folder for download
        run: |
          mkdir -p single_file
          mkdir -p download_directory
      - name: checking current directory
        run: |
          pwd
          ls -ltr
      - name: Download single file artifact
        uses: actions/download-artifact@v4
        with: 
          name: single_file  
          path: single_file
      - name: Download directory
        uses: actions/download-artifact@v8
        with: 
          name: directory_artifacts
          path: download_directory
      - name: checking current directory post download
        run: |
           pwd
           echo " CHECKING SINGLE FILE DIRECTORY "
           ls -ltr single_file
           echo " CHECKING DIRECTORY ARTIFACTS "
           ls -ltr download_directory
